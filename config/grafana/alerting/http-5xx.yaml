apiVersion: 1

groups:
  - orgId: 1
    name: order-tracker-http-5xx
    folder: Observability
    interval: 30s
    rules:
      - uid: order-tracker-http-5xx
        title: Order Tracker HTTP 5xx responses
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'sum(increase(http_server_requests_total{http_response_status_code=~"5.."}[5m])) or vector(0)'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings:
                mode: dropNN
              refId: B
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    type: last
                    params: []
                  type: query
              refId: C
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: "Order Tracker API returned at least one HTTP 5xx response in the last 5 minutes"
          endpoint: "/api/orders/{order_id}"
          window: "5m"
          dashboard_url: "http://127.0.0.1:3000/d/order-tracker-http"
        labels:
          severity: warning
        notification_settings:
          receiver: order-tracker-incident-responder
        isPaused: false
